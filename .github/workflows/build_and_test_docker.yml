name: Build and Test with Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-dockerize:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make docker.io

      # Step 3: Build project
      - name: Build project
        run: |
          mkdir build
          cd build
          cmake ..
          make

      # Step 4: Run tests
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      # Step 5: Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 6: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t my-docker-repo/my-program:latest .

      # Step 7: Push Docker image
      - name: Push Docker image
        run: |
          docker push my-docker-repo/my-program:latest

      # Step 8: Run Docker container
      - name: Run Docker container
        run: |
          docker run --rm my-docker-repo/my-program:latest
